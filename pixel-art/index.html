<!DOCTYPE html>

<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/style_sheets.css">
    
    <link rel="icon" href="/images/dark_icon.png" media="(prefers-color-scheme: dark)">

    <link rel="icon" href="/images/light_icon.png" media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)">
    <title>kurff.dev</title>
  </head>
  <body class="body1" style="background-color: black;">
    <!-- <div class="scroll-left" style="background: #430905; color: rgb(134, 125, 125); font-size: 30px;">
      <p class="marquee-text">THIS WEBSITE IS IN W.I.P.!</p>
    </div> -->
    <hr>
    <br>

    <p class="head" style="color: white;">kurff.dev</p>

    <br>
    <hr>

    <p class="text" style="color: rgb(203, 203, 203);">pixel art</p>

    <br>

    <div id="project and stuff buttons">

      <a href="/">
        <button class="button1"
          style="width: 95%; height: 125px; background-image: linear-gradient(to bottom, #555555, #111111); color: #FFFFFF; opacity: 0.25;">go home</button>
      </a>
    </div>

    <br><br><hr><br>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 15px; margin: 0 auto; width: max-content;">
        <div style="display: flex; align-items: flex-start; position: relative;">
            <canvas id="canvas" width="633" height="633" data-color="#FFFFFF" style="border:1px solid #555555;"></canvas>
            
            <div style="position: absolute; right: -60px; top: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 50px;">
                <div id="colour picker" style="display: block;">
                    <input type="color" id="colour" value="#FFFFFF" style="-webkit-appearance: none; appearance: none; border: none; width: 50px; height: 50px; padding: 0; background: none; cursor: pointer;">
                    <div class="subtext" style="color: rgb(146, 146, 146);"></div>
                </div>

                <button id="bucketToggle" class="button1" style="width: 50px; background-image: linear-gradient(to bottom, #353535, #4f4f4f); color: #000000;">
                    <img id="bucketImg" src="/images/nosket.png" alt="save button" style="width: 24px; height: 24px;" draggable="false">
                </button>

                <button id="pressureToggle" class="button1" style="width: 50px; background-image: linear-gradient(to bottom, #353535, #4f4f4f); color: #000000;">
                  <img id="pressureImg" draggable="false" src="/images/yessure.png" alt="pressure button" style="width: 24px; height: 24px;">
                </button>

                
                <button onclick="clearCanvas()" class="button1" style="width: 50px; background-image: linear-gradient(to bottom, #353535, #4f4f4f); color: #000000;">
                    <img src="/images/clear_canvas.png" draggable="false" alt="clear canvas button" style="width: 32px; height: 24px;">
                </button>

                <button id="eraserToggle" class="button1" style="width: 50px; background-image: linear-gradient(to bottom, #353535, #4f4f4f); color: #000000;">
                    <img id="eraserImg" draggable="false" src="/images/noraser.png" alt="toggle eraser button" style="width: 24px; height: 24px;">
                </button>
                
                <button id="undoButton" class="button1" style="width: 50px; background-image: linear-gradient(to bottom, #353535, #4f4f4f); color: #000000;">
                    <img id="undoImg" draggable="false" src="/images/undo.png" alt="undo button" style="width: 24px; height: 24px;">
                </button>
                <button id="redoButton" class="button1" style="width: 50px; background-image: linear-gradient(to bottom, #353535, #4f4f4f); color: #000000;">
                    <img id="redoImg" draggable="false" src="/images/redo.png" alt="redo button" style="width: 24px; height: 24px;">
                </button>
                <br>
                <button id="saveButton" class="button1" style="width: 50px; background-image: linear-gradient(to bottom, #353535, #4f4f4f); color: #000000;">
                    <img id="saveImg" src="/images/saver.png" alt="save button" style="width: 24px; height: 24px;" draggable="false">
                </button>

            </div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: #FFFFFF; width: 633px; text-align: center;">
            <div>
                <label for="brushSlider">brush size:</label>
                <input type="number" id="brushInput" min="1" max="200" value="4">
            </div>
            <input type="range" id="brushSlider" min="1" max="200" value="4" step="1" style="width: 150px;">
        </div>
    </div>



    <br><br>

    <div style="width: 50%; aspect-ratio: 1 / 1.04395604396; margin: 0 auto; display: block; background-image: url('/images/good-time-gal.gif'); background-size: cover; background-position: center; box-shadow: inset 0 0 100px 50px #000000; opacity: 0.03125;" alt="hello my lady hello my good time gal, blah blah kissed my wife, baby my hearts on fire or whatever he says"></div>

    <p style="color: rgb(71, 71, 71);">© <a href="https://mediafromthedevil.net/" style="color: rgb(71, 71, 71);">Media from the Devil</a> 2026</p>
    <script src="/script.js" defer></script>
    <script src="/canvas.js" defer></script>
  </body>
</html>
